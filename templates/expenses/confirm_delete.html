{% extends "base.html" %}
{% block title %}ยืนยันการลบ{% endblock %}
{% block content %}
<h1 class="text-2xl font-bold text-slate-100 mb-6 flex items-center gap-2">
    <i class="fa-solid fa-triangle-exclamation text-amber-400"></i> ยืนยันการลบ
</h1>

<div class="glass-card rounded-2xl shadow-lg p-6 max-w-md">
    <p class="text-slate-300 mb-1">คุณต้องการลบ "<strong class="text-slate-100">{{ object }}</strong>" ใช่หรือไม่?</p>
    <p class="text-slate-500 text-xs mb-5">การลบไม่สามารถย้อนกลับได้</p>
    <form method="post" class="flex gap-3">
        {% csrf_token %}
        <button type="submit"
                class="flex-1 py-2.5 rounded-lg bg-rose-500 hover:bg-rose-400 text-navy-950 font-semibold transition shadow-lg shadow-rose-500/20">
            <i class="fa-solid fa-trash"></i> ยืนยันการลบ
        </button>
        <a href="{% url cancel_url %}"
           class="flex-1 text-center py-2.5 rounded-lg bg-white/5 hover:bg-white/10 text-slate-300 border border-white/10 transition">
            ยกเลิก
        </a>
    </form>
</div>
{% endblock %}
