{% extends "base.html" %}{% block title %}เข้าสู่ระบบ{% endblock %}{% block auth_content %}<div class="auth-page"><div style="width:min(420px,100%)"><div class="auth-brand"><div class="brand-mark">฿</div><h1>Daily Expense Tracker</h1><p>ระบบบันทึกรายรับ-รายจ่ายประจำวัน</p></div><div class="auth-card">{% if form.errors %}<div class="auth-error"><i class="fa-solid fa-circle-exclamation"></i> ชื่อผู้ใช้หรือรหัสผ่านไม่ถูกต้อง</div>{% endif %}<form method="post">{% csrf_token %}<div class="field"><label for="id_username">ชื่อผู้ใช้</label><input class="input" id="id_username" type="text" name="username" autocomplete="username" required autofocus></div><div class="field"><label for="id_password">รหัสผ่าน</label><input class="input" id="id_password" type="password" name="password" autocomplete="current-password" required></div><button class="btn btn-primary" style="width:100%;margin-top:5px" type="submit"><i class="fa-solid fa-right-to-bracket"></i> เข้าสู่ระบบ</button></form></div><div class="auth-footer">© {% now "Y" %} Daily Expense Tracker</div></div></div>{% endblock %}
