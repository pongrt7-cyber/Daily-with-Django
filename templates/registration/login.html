{% extends "base.html" %}
{% block title %}เข้าสู่ระบบ{% endblock %}
{% block auth_content %}
<div class="min-h-screen flex items-center justify-center px-4" style="background:#F6F1E4;">
    <div class="w-full max-w-sm">
        <div class="text-center mb-6">
            <div class="text-4xl mb-3" style="color:#C49A4A;">฿</div>
            <h1 class="text-xl font-bold" style="color:#1E2A44;">Daily Expense Tracker</h1>
            <p class="text-sm" style="color:#8B8371;">ระบบบันทึกรายรับ-รายจ่ายประจำวัน</p>
        </div>
        <div class="glass-card rounded-2xl shadow-2xl p-6 auth-card">
            <h2 class="text-lg font-semibold mb-4 flex items-center gap-2" style="color:#1E2A44;">
                <i class="fa-solid fa-right-to-bracket" style="color:#C49A4A;"></i> เข้าสู่ระบบ
            </h2>
            <form method="post">
                {% csrf_token %}
                <div class="mb-4">
                    <label class="block text-sm mb-1" style="color:#8B8371;">ชื่อผู้ใช้</label>
                    <input type="text" name="username" required autofocus class="input-dark w-full rounded-lg border px-3 py-2.5">
                </div>
                <div class="mb-6">
                    <label class="block text-sm mb-1" style="color:#8B8371;">รหัสผ่าน</label>
                    <input type="password" name="password" required class="input-dark w-full rounded-lg border px-3 py-2.5">
                </div>
                <button type="submit" class="w-full py-2.5 rounded-lg text-white font-semibold transition" style="background:#1E2A44;">เข้าสู่ระบบ</button>
            </form>
        </div>
        <p class="text-center text-xs mt-4" style="color:#8B8371;">© {% now "Y" %} Daily Expense Tracker</p>
    </div>
</div>
{% if form.errors %}
<script>
document.addEventListener('DOMContentLoaded',function(){Swal.fire({icon:'error',title:'เข้าสู่ระบบไม่สำเร็จ',text:'ชื่อผู้ใช้หรือรหัสผ่านไม่ถูกต้อง',background:'#FFFDF7',color:'#2B2A26',confirmButtonColor:'#B23A2E',confirmButtonText:'ลองอีกครั้ง'});});
</script>
{% endif %}
{% endblock %}
